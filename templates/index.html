<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل السعرات الحرارية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { display: none; }
        .upload-btn { background: #4CAF50; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; display: inline-block; font-size: 16px; margin: 10px 0; width: 80%; }
        img { max-width: 100%; height: 250px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
        .result-box { background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: right; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>محلل السعرات الحرارية للوجبات</h2>
    <p>قم بتصوير وجبتك أو اختر صورة لتحليلها بالذكاء الاصطناعي</p>

    <!-- نموذج رفع الصورة -->
    <form id="uploadForm">
        <label for="fileInput" class="upload-btn">اختر صورة الوجبة أو صورها</label>
        <input type="file" id="fileInput" name="file" accept="image/*" capture="environment">
        <br>
        <img id="preview" alt="معاينة الصورة">
        <br>
        <button type="submit" id="submitBtn" class="upload-btn" style="background: #008CBA; display: none;">تحليل الوجبة</button>
    </form>

    <div id="result" class="result-box"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');
    const resultBox = document.getElementById('result');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                submitBtn.style.display = 'inline-block';
            }
            reader.readAsDataURL(file);
        }
    });

    uploadForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        resultBox.style.display = 'block';
        resultBox.innerText = 'جاري تحليل الوجبة، يرجى الانتظار...';

        try {
            const response = await fetch('/', {
                method: 'POST',
                body: formData
            });
            const htmlText = await response.text();
            // استخراج النتيجة أو إعادة تحميل الصفحة بعرض النتائج
            document.open();
            document.write(htmlText);
            document.close();
        } catch (err) {
            resultBox.innerText = 'حدث خطأ أثناء الاتصال بالسيرفر.';
        }
    });
</script>

</body>
</html>
