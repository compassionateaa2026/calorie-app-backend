<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل السعرات الحرارية الذكي</title>
    <!-- استيراد خط تجوال العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #10B981;
            --primary-hover: #059669;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 24px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .upload-card {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            background: #FAFCFF;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-card:hover {
            border-color: var(--primary-color);
        }

        .file-input {
            display: none;
        }

        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .upload-label svg {
            width: 40px;
            height: 40px;
            stroke: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* مؤشر التحميل */
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            margin-top: 24px;
            background: #F1F5F9;
            border-radius: 16px;
            padding: 16px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #334155;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>محلل السعرات الحرارية</h1>
            <p>التقط صورة لطبقك واحصل على تحليل تغذوي فوري</p>
        </header>

        <form id="uploadForm" method="POST" enctype="multipart/form-data">
            <div class="upload-card" onclick="document.getElementById('fileInput').click();">
                <input type="file" id="fileInput" name="file" class="file-input" accept="image/*" required onchange="updateFileName(this)">
                <div class="upload-label">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
                    </svg>
                    <span id="fileText">اضغط هنا لاختيار أو تصوير وجبتك</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">تحليل الوجبة بالذكاء الاصطناعي</button>
        </form>

        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>جاري تحليل الوجبة وحساب السعرات...</p>
        </div>

        {% if result %}
        <div class="result-section">
            <strong>النتيجة:</strong><br>
            {{ result }}
        </div>
        {% endif %}
    </div>

    <script>
        function updateFileName(input) {
            const textSpan = document.getElementById('fileText');
            if (input.files && input.files[0]) {
                textSpan.textContent = "تم اختيار الصورة: " + input.files[0].name;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', function() {
            document.getElementById('loadingIndicator').style.display = 'block';
        });
    </script>

</body>
</html>
